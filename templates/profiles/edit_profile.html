{% extends 'base/base.html' %}
{% load static %}

{% block title %}Edit Profile - SkillSwap AI Settings{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="glass-card p-4 p-md-5 border-gradient animate-fade-up">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary border-opacity-25">
                    <div>
                        <div class="badge-neon mb-1"><i class="bi bi-gear-fill"></i> User Settings</div>
                        <h2 class="font-heading fw-bold text-white mb-0">Edit Profile & Skills</h2>
                    </div>
                    <a href="{% url 'profiles:profile' %}" class="btn btn-sm btn-neon-outline"><i class="bi bi-arrow-left me-1"></i> Back to Profile</a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">First Name</label>
                            <input type="text" name="first_name" class="form-control glass-input text-white" value="{{ user.first_name }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Last Name</label>
                            <input type="text" name="last_name" class="form-control glass-input text-white" value="{{ user.last_name }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control glass-input text-white" value="{{ user.email }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Location / Timezone</label>
                            <input type="text" name="location" class="form-control glass-input text-white" value="{{ profile.location|default:'Gujarat, India' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label text-sub small fw-semibold">Professional Headline</label>
                            <input type="text" name="headline" class="form-control glass-input text-white" value="{{ profile.headline|default:'Full-stack Developer & Mentor' }}" placeholder="e.g. Python Architect | UI/UX Enthusiast">
                        </div>

                        <div class="col-12">
                            <label class="form-label text-sub small fw-semibold">Profile Avatar</label>
                            <input type="file" name="avatar" class="form-control glass-input text-white" accept="image/*">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-sub small fw-semibold">Bio / Mentor Intro</label>
                        <textarea name="bio" class="form-control glass-input text-white" rows="3" placeholder="Tell other learners about your background and teaching style...">{{ profile.bio }}</textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label text-sub small fw-semibold">Experience Level</label>
                            <select name="experience_level" class="form-select glass-input text-white">
                                <option value="Beginner" {% if profile.experience_level == 'Beginner' %}selected{% endif %}>Beginner</option>
                                <option value="Intermediate" {% if profile.experience_level == 'Intermediate' or not profile.experience_level %}selected{% endif %}>Intermediate</option>
                                <option value="Advanced" {% if profile.experience_level == 'Advanced' %}selected{% endif %}>Advanced</option>
                                <option value="Expert" {% if profile.experience_level == 'Expert' %}selected{% endif %}>Expert</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-sub small fw-semibold">Learning Mode</label>
                            <select name="learning_mode" class="form-select glass-input text-white">
                                <option value="1-on-1 Video" {% if profile.learning_mode == '1-on-1 Video' %}selected{% endif %}>1-on-1 Video</option>
                                <option value="Async Messaging" {% if profile.learning_mode == 'Async Messaging' %}selected{% endif %}>Async Messaging</option>
                                <option value="Group Workshop" {% if profile.learning_mode == 'Group Workshop' %}selected{% endif %}>Group Workshop</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-sub small fw-semibold">Availability</label>
                            <input type="text" name="availability" class="form-control glass-input text-white" value="{{ profile.availability|default:'Evenings & Weekends' }}">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Skills You Teach (Comma Separated)</label>
                            <input type="text" name="skills_offered" class="form-control glass-input text-white" value="{{ profile.skills_offered|default:'Python, Django, REST APIs, HTML/CSS' }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Skills You Want to Learn (Comma Separated)</label>
                            <input type="text" name="skills_wanted" class="form-control glass-input text-white" value="{{ profile.skills_wanted|default:'UI/UX Design, Figma, PyTorch, Spanish' }}">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label text-sub small fw-semibold">GitHub Profile URL</label>
                            <input type="url" name="github_url" class="form-control glass-input text-white" value="{{ profile.github_url }}">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-sub small fw-semibold">LinkedIn Profile URL</label>
                            <input type="url" name="linkedin_url" class="form-control glass-input text-white" value="{{ profile.linkedin_url }}">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label text-sub small fw-semibold">Portfolio Website URL</label>
                            <input type="url" name="website_url" class="form-control glass-input text-white" value="{{ profile.website_url }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                        <a href="{% url 'profiles:profile' %}" class="btn btn-neon-outline">Cancel</a>
                        <button type="submit" class="btn btn-neon-primary px-4">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Profile Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
