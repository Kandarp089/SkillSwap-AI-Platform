<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — SkillSwap AI Control Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #08090D;
            color: #F5F7FA;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #101118;
            border: 1px solid #25283A;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .form-control {
            background: #151722;
            border: 1px solid #25283A;
            color: #fff;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: #151722;
            border-color: #8B5CF6;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(139, 92, 246, 0.25);
        }
        .btn-admin-login {
            background: linear-gradient(135deg, #8B5CF6, #06B6D4);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.85rem;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="rounded-circle p-3 d-inline-flex align-items-center justify-content-center mb-3" style="background: linear-gradient(135deg, #8B5CF6, #06B6D4); width: 60px; height: 60px;">
                <i class="bi bi-shield-lock-fill text-white fs-3"></i>
            </div>
            <h3 class="font-heading fw-bold mb-1">Control Center Login</h3>
            <p class="text-secondary small">SkillSwap AI Super Admin Portal</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'adminpanel:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Admin Username</label>
                <input type="text" name="username" required class="form-control" placeholder="Enter username">
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">Password</label>
                <input type="password" name="password" required class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-admin-login mb-3">
                <i class="bi bi-key-fill me-1"></i> Access Control Center
            </button>
            <div class="text-center">
                <a href="/" class="text-secondary text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Public Platform</a>
            </div>
        </form>
    </div>

</body>
</html>
