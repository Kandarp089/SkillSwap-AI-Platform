{% extends 'base/base.html' %}
{% load static %}

{% block title %}Contact Us - SkillSwap AI Support{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="glass-card p-4 p-md-5 border-gradient animate-fade-up">
                <div class="text-center mb-4">
                    <div class="badge-neon mb-2"><i class="bi bi-envelope-fill"></i> Get in Touch</div>
                    <h2 class="font-heading fw-bold text-white mb-1">Contact SkillSwap AI Team</h2>
                    <p class="text-sub small">Have a question or suggestion? We'd love to hear from you!</p>
                </div>

                <form onsubmit="event.preventDefault(); showToast('Thank you! Your message has been sent to support.', 'success');">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Your Name</label>
                            <input type="text" class="form-control glass-input text-white" placeholder="Kandarp Upadhyay" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Email Address</label>
                            <input type="email" class="form-control glass-input text-white" placeholder="kandarp@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-sub small fw-semibold">Subject</label>
                        <input type="text" class="form-control glass-input text-white" placeholder="Feature suggestion / Account support" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-sub small fw-semibold">Message</label>
                        <textarea class="form-control glass-input text-white" rows="4" placeholder="How can we help you?" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-neon-primary w-100 btn-lg shadow-lg">
                        <i class="bi bi-send-fill me-1"></i> Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
