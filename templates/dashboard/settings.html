{% extends 'base/base.html' %}
{% load static %}

{% block title %}Account Settings & Preferences - SkillSwap AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="glass-card p-4 p-md-5 border-gradient animate-fade-up">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary border-opacity-25">
                    <div>
                        <div class="badge-neon mb-1"><i class="bi bi-shield-lock-fill"></i> Security & Preferences</div>
                        <h2 class="font-heading fw-bold text-white mb-0">Account Settings</h2>
                    </div>
                </div>

                <!-- Settings Forms -->
                <div class="mb-4">
                    <h5 class="font-heading text-white mb-3">Notification Preferences</h5>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input glass-input" type="checkbox" id="emailNotifCheck" checked>
                        <label class="form-check-label text-sub small" for="emailNotifCheck">
                            Email Notifications for new Skill Swap proposals
                        </label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input glass-input" type="checkbox" id="chatNotifCheck" checked>
                        <label class="form-check-label text-sub small" for="chatNotifCheck">
                            Chat sound & browser alerts for unread messages
                        </label>
                    </div>
                </div>

                <div class="mb-4 pt-3 border-top border-secondary border-opacity-25">
                    <h5 class="font-heading text-white mb-3">Change Password</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">Current Password</label>
                            <input type="password" class="form-control glass-input text-white" placeholder="••••••••">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-sub small fw-semibold">New Password</label>
                            <input type="password" class="form-control glass-input text-white" placeholder="••••••••">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                    <button class="btn btn-neon-primary px-4" onclick="showToast('Settings saved successfully!', 'success')">
                        <i class="bi bi-check-circle-fill me-1"></i> Save Preferences
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
